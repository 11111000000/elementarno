[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elementarno"
version = "0.3.0"
description = "Доказательный разбор сцен по фотографиям: улики со ссылками, версии, уточняющие вопросы"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
images = ["pillow>=10"]

[project.scripts]
elementarno = "tools.elementarno.cli:main"

[tool.setuptools]
packages = ["tools.elementarno"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
